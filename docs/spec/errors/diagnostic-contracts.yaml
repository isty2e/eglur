# Normative machine-readable diagnostic field contract.
# Trigger conditions and contextual requirement explanations remain in the
# per-code Markdown catalogs. Conformance-stable per-code assertions and the
# global source-span interchange contracts live here.
version: '0.1'
defaults:
  help: optional
  related: optional
source_span:
  fields:
    required:
      kind: source
      source: Str
      bytes: ByteRange
    optional:
      text: TextRange
  byte_range:
    fields:
      required:
        start: i64
        end: i64
    start_base: 0
    unit: physical_byte
    end_semantics: half_open
  text_range:
    fields:
      required:
        start: SourceCoordinate
        end: SourceCoordinate
    coordinate:
      fields:
        required:
          line: i64
          column: i64
      line_base: 1
      column_base: 1
      column_unit: unicode_scalar
    normalization:
      leading_utf8_bom: ignored
      line_endings: logical_lf
    end_semantics: half_open
  ordering:
    source_keys:
    - source
    - bytes.start
    - bytes.end
  examples:
  - id: text-source-span
    span:
      kind: source
      source: main.eglur
      bytes:
        start: 12
        end: 13
      text:
        start:
          line: 2
          column: 4
        end:
          line: 2
          column: 5
  - id: byte-only-source-span
    span:
      kind: source
      source: invalid.eglur
      bytes:
        start: 12
        end: 13
primary_span:
  variants:
    source: SourceSpan
    unavailable:
      kind: unavailable
related_span:
  fields:
    required:
      span: SourceSpan
      label: Str
  ordering:
    default: source
    code_specific_override: true
    source_keys:
    - span.source
    - span.bytes.start
    - span.bytes.end
    - label
  examples:
  - id: trait-method-declaration
    spans:
    - span:
        kind: source
        source: traits.eglur
        bytes:
          start: 16
          end: 55
        text:
          start:
            line: 2
            column: 3
          end:
            line: 2
            column: 42
      label: trait method declared here
  - id: ownership-path-causes
    spans:
    - span:
        kind: source
        source: app.eglur
        bytes:
          start: 40
          end: 65
        text:
          start:
            line: 5
            column: 3
          end:
            line: 5
            column: 28
      label: ownership root created here
    - span:
        kind: source
        source: app.eglur
        bytes:
          start: 80
          end: 81
        text:
          start:
            line: 7
            column: 12
          end:
            line: 7
            column: 13
      label: first consume occurs here

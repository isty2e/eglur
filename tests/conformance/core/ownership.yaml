- id: OWN-conditional-root-match-move-establishes-direct-root-in-some-arm
  category: ownership
  title: conditional root match move establishes direct root in Some arm
  code: |
    fn consume_opt(v: Opt[Own[i64]]) -> i64 {
      match move v {
        Some(x) => {
          drop_own move x
          return 1
        }
        None => {

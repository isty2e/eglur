- id: OWN-match-may-keep-the-whole-carrier
  category: ownership
  title: a whole-carrier binding covers an unnamed owned payload
  code: |
    import std::test::emit!

    fn release(v: Opt[Own[i64]]) -> i64 = match move v {
      whole @ Some(_) => {
        drop_own move whole
        yield 1
      },
      empty @ None => {
        drop_own move empty
        yield 0
      }
    }

    fn main!() -> Res[Str, Str] {
      let n: i64 = 3
      emit!(to_str(release(Some(own n))))
      yield Ok(to_str(release(None)))
    }
  expect:
    value:
      kind: Ok
      repr: '"0"'
    side_effects:
    - '1'
- id: OWN-carrier-binding-is-independent-across-or-alternatives
  category: ownership
  title: exclusive alternatives may each bind the whole carrier once
  code: |
    fn release(r: Res[Own[i64], Str]) -> i64 = match move r {
      (whole @ Ok(_)) | (whole @ Err(_)) => {
        drop_own move whole
        yield 1
      }
    }

    fn main!() -> Res[Str, Str] = Ok(to_str(release(Err("empty"))))
  expect:
    value:
      kind: Ok
      repr: '"1"'

tests:
- id: OWN-shadowing-does-not-discharge-hidden-root
  category: ownership
  title: nested spelling shadow does not discharge a hidden ownership root
  code: |
    fn consume(root: Own[i64]) -> Unit {
      {
        let root = 1
        _ = root
      }
      drop_own move root
    }

    fn main!() -> Res[Str, Str] {
      let value = 1
      let root = own value
      consume(move root)
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: OWN-move-operator-requires-own-operand
  category: ownership
  title: move operator requires Own operand
  code: |
    fn bad_move(x: i64) -> i64 {
      let y = move x
      yield y
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: MOVE_REQUIRES_OWN
      message_contains:
      - move
      - Own
      - operand
      data_keys: []
- id: OWN-own-operator-rejects-own-operand
  category: ownership
  title: own operator rejects Own operand
  code: |
    fn bad_own(x: Own[i64]) -> i64 {
      let y = own x
      drop_own move y
      yield 0
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: OWN_REQUIRES_NON_OWN
      message_contains:
      - own
      - Own
      - non-Own
      data_keys: []

      kind: Ok
      repr: '"ok"'
- id: OWN-consuming-result-match-discharges-ok-and-retains-err-value
  category: ownership
  title: consuming a result discharges its Ok payload and preserves its Err value
  code: |
    import std::test::emit!

    fn finish(v: Res[Own[i64], Str]) -> Str = match move v {
      Ok(root) => {
        drop_own move root
        yield "released"
      },
      Err(reason) => reason
    }

    fn main!() -> Res[Str, Str] {
      let n: i64 = 3
      emit!(finish(Ok(own n)))
      yield Ok(finish(Err("not opened")))
    }
  expect:
    value:
      kind: Ok
      repr: '"not opened"'
    side_effects:
    - released
- id: OWN-option-pattern-cannot-bind-both-carrier-and-payload
  category: ownership
  title: an unused owning binding still overlaps before the guard
  code: |
    fn consume(v: Opt[Own[i64]]) -> i64 = match move v {
      whole @ Some(x) if false => { drop_own move x
                                    yield 1 },
      rest => { drop_own move rest
                yield 0 }
    }

    fn main!() -> Res[Str, Str] = Ok("unused")
  expect:
    compile_error:
      code: PATTERN_OWNERSHIP_BINDING_OVERLAP
      message_contains:
      - pattern
      - binding
      - ownership
      - overlap
      data_keys: []
